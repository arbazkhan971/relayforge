<svg xmlns="http://www.w3.org/2000/svg" width="640" height="148" viewBox="0 0 640 148" role="img" aria-labelledby="t d">
  <title id="t">RelayForge</title>
  <desc id="d">RelayForge logo on a dark plate so it stays readable on GitHub light and dark themes.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="640" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ring" x1="28" y1="28" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="640" height="148" rx="24" fill="url(#plate)"/>
  <!-- mark -->
  <rect x="20" y="26" width="96" height="96" rx="24" fill="#020617" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M46 74c0-15.5 12.5-28 28-28h10c10.5 0 19 8.5 19 19s-8.5 19-19 19H66"
        fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round"/>
  <path d="M90 74c0 15.5-12.5 28-28 28H52c-10.5 0-19-8.5-19-19s8.5-19 19-19h10"
        fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
  <circle cx="48" cy="62" r="5" fill="#FBBF24"/>
  <circle cx="88" cy="86" r="5" fill="#FBBF24"/>
  <circle cx="68" cy="74" r="3" fill="#F8FAFC"/>
  <!-- wordmark -->
  <text x="140" y="82" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">RelayForge</text>
  <text x="142" y="112" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Contained AI agent teams</text>
</svg>
