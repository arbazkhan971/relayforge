version: 1
defaults:
  namespace: loop
  dashboardPort: 4318

# The minimal, safe shape: one provider, a lean planner/implementer/reviewer team, no pinned
# models and no unsafe flags. Execution runs in an isolated git worktree (your checkout is
# never touched) and untrusted verifier commands run in a separate OS sandbox, so the config
# itself needs nothing dangerous.
projects:
  - name: basic-demo
    brief: brief.md
    workingDir: .
    safetyMode: workspace-write
    providers:
      agent:
        type: claude
        auth:
          mode: auto
    roles:
      - name: planner
        title: Planner / Orchestrator
        provider: agent
        sme: architect
      - name: implementer
        title: Implementer
        provider: agent
        sme: fullstack
      - name: reviewer
        title: Independent Reviewer
        provider: agent
        sme: code-reviewer
    loops:
      - name: delivery-loop
        maxIterations: 6
        orchestrator: planner
        reviewer: reviewer
        maxRepairs: 2
        stopWhen:
          - all tasks done
          - tests pass
