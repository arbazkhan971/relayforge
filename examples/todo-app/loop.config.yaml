version: 1
defaults:
  namespace: todo
  runDir: .loop/runs
projects:
  - name: todo-app
    brief: brief.md
    workingDir: .
    intelligence: PROJECT-INTELLIGENCE.md
    safetyMode: workspace-write
    providers:
      planner:
        type: claude
        model: claude-sonnet-4-6
        promptMode: argument
      impl:
        type: claude
        model: claude-sonnet-4-6
        promptMode: argument
    roles:
      - name: pm
        title: Product Manager
        provider: planner
        sme: product-manager
      - name: be
        title: Backend Engineer
        provider: impl
        sme: backend
      - name: fe
        title: Frontend Engineer
        provider: impl
        sme: frontend
      - name: qa
        title: QA Reviewer
        provider: impl
        sme: qa
    loops:
      - name: build
        orchestrator: pm
        reviewer: qa
        maxIterations: 5
        maxRepairs: 2
        maxParallel: 2
        pollSeconds: 1
        # A positive budget REQUIRES an enforceable per-call cap: without one, every call would have
        # to reserve the whole budget (a one-call run), so the loop fails closed before the planner.
        budgetUsd: 4.0
        maxCostPerCallUsd: 0.75
        stopWhen: [all tasks done]
