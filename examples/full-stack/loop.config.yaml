version: 1
defaults:
  namespace: loop
  dashboardPort: 4318

# A larger single-repository team. Multi-repository autonomous execution is NOT supported in
# this release (it is rejected by `loop validate`), so point `workingDir` at one repo and run
# the team there. Providers are mixed by strength; models are left unpinned so each CLI uses
# its own default. Execution runs in isolated git worktrees (your checkout is never touched);
# untrusted verifier commands run in a separate OS sandbox.
projects:
  - name: full-stack-demo
    brief: brief.md
    workingDir: .
    safetyMode: workspace-write
    providers:
      claude:
        type: claude
        auth:
          mode: auto
      codex:
        type: codex
        effort: medium
        auth:
          mode: auto
      gemini:
        type: gemini
        auth:
          mode: auto
    roles:
      - name: architect
        title: Architecture and release lead
        provider: claude
        sme: architect
      - name: frontend
        title: Frontend engineer
        provider: claude
        sme: frontend
      - name: backend
        title: Backend engineer
        provider: codex
        sme: backend
      - name: qa
        title: QA reviewer
        provider: gemini
        sme: qa
    loops:
      - name: delivery-loop
        maxIterations: 8
        orchestrator: architect
        reviewer: qa
        maxRepairs: 2
        maxParallel: 2
        postMergeVerify: true
        stopWhen:
          - all tasks done
          - tests pass
